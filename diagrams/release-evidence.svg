<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker></defs><rect x="1" y="1" width="1398" height="1268" fill="white" stroke="#D6E2EA" rx="18"/><text x="48" y="63" font-size="34" fill="#173047" font-weight="700">The tests passed. The release still needs a decision.</text><text x="48" y="104" font-size="21" fill="#536B7C" font-weight="400">A result describes what was checked. Its applicability depends on the candidate and intended cohort.</text><rect x="48" y="146" width="1304" height="100" fill="#173047" stroke="none" rx="13"/><text x="72" y="182" font-size="18" fill="#BDD6E1" font-weight="700">ONB-017 / CHG-42 · RELEASE CANDIDATE REL-42</text><text x="72" y="222" font-size="25" fill="white" font-weight="600">Synthetic review · Not deployed · Historical evaluation result is hypothetical</text><rect x="48" y="279" width="625" height="281" fill="#EEF4FC" stroke="none" rx="13"/><text x="72" y="318" font-size="17" fill="#295FA7" font-weight="700">RETAIN THE HISTORICAL RESULT</text><text x="72" y="361" font-size="28" fill="#173047" font-weight="700">EVAL-42 · pass under v4</text><text x="72" y="407" font-size="22" fill="#536B7C" font-weight="400">Spec SP-42@r3 · context CTX-42</text><text x="72" y="446" font-size="22" fill="#536B7C" font-weight="400">Candidate a71 · tests TEST-42@r2</text><text x="72" y="485" font-size="22" fill="#536B7C" font-weight="400">Governing rule POL-17@v4</text><text x="72" y="524" font-size="22" fill="#536B7C" font-weight="400">Preserve this result and its input bindings.</text><rect x="726" y="279" width="626" height="281" fill="#FCF3E2" stroke="none" rx="13"/><text x="750" y="318" font-size="17" fill="#98621B" font-weight="700">A MATERIAL INPUT HAS CHANGED</text><text x="750" y="361" font-size="28" fill="#173047" font-weight="700">POL-17@v5 now applies</text><text x="750" y="407" font-size="21" fill="#536B7C" font-weight="400">Domain owner confirms cohort + effective time.</text><text x="750" y="446" font-size="21" fill="#536B7C" font-weight="400">The rule changes a required document.</text><text x="750" y="485" font-size="21" fill="#536B7C" font-weight="400">Old results do not prove the new behavior.</text><text x="750" y="524" font-size="21" fill="#536B7C" font-weight="400">A newer revision alone would not imply this.</text><path d="M362 564 V604 H586 V640" stroke="#295FA7" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M1036 564 V604 H814 V640" stroke="#98621B" stroke-width="3" fill="none" marker-end="url(#amber)"/><rect x="48" y="644" width="1304" height="142" fill="#FCEFEB" stroke="none" rx="13"/><text x="72" y="680" font-size="18" fill="#AC4836" font-weight="700">CURRENT DECISION · HOLD REL-42</text><text x="72" y="724" font-size="29" fill="#173047" font-weight="700">Missing applicable evidence for the changed requirement.</text><text x="72" y="762" font-size="22" fill="#AC4836" font-weight="400">Owner: service/release owner · No automatic promotion from a green test badge.</text><path d="M700 789 V809 H253 V829" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="48" y="833" width="410" height="234" fill="#EEF4FC" stroke="none" rx="13"/><text x="70" y="877" font-size="25" fill="#173047" font-weight="700">1 · Review impact</text><text x="70" y="924" font-size="20" fill="#536B7C" font-weight="400">Domain owner: meaning + timing</text><text x="70" y="959" font-size="20" fill="#536B7C" font-weight="400">Engineer: code, consumers, cases</text><text x="70" y="994" font-size="20" fill="#536B7C" font-weight="400">Graph links guide; gaps stay visible.</text><path d="M462 955 H489" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="495" y="833" width="410" height="234" fill="#EEF4FC" stroke="none" rx="13"/><text x="517" y="877" font-size="25" fill="#173047" font-weight="700">2 · Requalify affected work</text><text x="517" y="924" font-size="20" fill="#536B7C" font-weight="400">Update spec / context as needed</text><text x="517" y="959" font-size="20" fill="#536B7C" font-weight="400">Change behavior where required</text><text x="517" y="994" font-size="20" fill="#536B7C" font-weight="400">Rerun affected checks; retain others</text><text x="517" y="1029" font-size="20" fill="#536B7C" font-weight="400">only with a justified basis.</text><path d="M909 955 H936" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="942" y="833" width="410" height="234" fill="#E7F5F0" stroke="none" rx="13"/><text x="964" y="877" font-size="25" fill="#173047" font-weight="700">3 · Authorize exact bundle</text><text x="964" y="924" font-size="20" fill="#536B7C" font-weight="400">Required evidence + decisions</text><text x="964" y="959" font-size="20" fill="#536B7C" font-weight="400">Immutable artifact / configuration</text><text x="964" y="994" font-size="20" fill="#536B7C" font-weight="400">Applicable rule + cohort binding</text><text x="964" y="1029" font-size="20" fill="#536B7C" font-weight="400">Owned rollout and recovery</text><path d="M1140 1070 V1092" stroke="#087B73" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="48" y="1096" width="1304" height="79" fill="#173047" stroke="none" rx="13"/><text x="72" y="1127" font-size="16" fill="#BDD6E1" font-weight="700">AFTER ACTUAL RELEASE</text><text x="72" y="1158" font-size="21" fill="white" font-weight="600">Link workflow outcomes to the deployed bundle → investigate → review → update sources, tests or intent.</text><text x="48" y="1210" font-size="20" fill="#536B7C" font-weight="400">The release gate enforces required bindings. The tracker and review view report verified events.</text><path d="M48 1221 H1352" stroke="#D6E2EA"/><text x="48" y="1250" font-size="16" fill="#536B7C" font-weight="400">Reference architecture · Synthetic ONB-017 · Tool options, not a tested integration</text><text x="1092" y="1250" font-size="16" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text></svg>