<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1370" viewBox="0 0 1500 1370" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73" /></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7" /></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B" /></marker></defs><rect x="1" y="1" width="1498" height="1368" rx="18" fill="white" stroke="#D6E2EA" /><text x="60" y="60" font-size="34" fill="#173047" font-weight="700">How six responsibilities become one delivery system</text><text x="60" y="99" font-size="23" fill="#536B7C" font-weight="400">Agree intent. Select context. Perform work. Verify release. Review outcomes.</text><rect x="60" y="128" width="1380" height="60" rx="14" fill="#173047" /><text x="82" y="167" font-size="22" fill="white" font-weight="600">L2 CONTROL THROUGHOUT   Source access · tool permissions · review · release authorization</text><rect x="60" y="246" width="610" height="200" rx="14" fill="#EEF4FC" /><text x="84" y="279" font-size="17" fill="#295FA7" font-weight="700">L6 · INTENT</text><text x="84" y="315" font-size="27" fill="#173047" font-weight="700">Agree the change</text><text x="84" y="352" font-size="22" fill="#536B7C" font-weight="400">Business outcome → maintained specification</text><text x="84" y="383" font-size="20" fill="#536B7C" font-weight="400">Product, domain experts and engineers agree behavior.</text><text x="84" y="414" font-size="20" fill="#536B7C" font-weight="400">Record acceptance examples and preserved behavior.</text><rect x="830" y="246" width="610" height="200" rx="14" fill="#E7F5F0" /><text x="854" y="279" font-size="17" fill="#295FA7" font-weight="700">L5 · KNOWLEDGE</text><text x="854" y="315" font-size="27" fill="#173047" font-weight="700">Maintain authoritative inputs</text><text x="854" y="352" font-size="22" fill="#536B7C" font-weight="400">Rules + code + contracts + accountable owners</text><text x="854" y="383" font-size="22" fill="#536B7C" font-weight="400">Search / catalog links; graph if useful</text><text x="854" y="414" font-size="22" fill="#536B7C" font-weight="400">Publish owned, versioned knowledge; expose gaps.</text><path d="M365 450 V539" fill="none" stroke="#087B73" stroke-width="3" marker-end="url(#teal)" /><text x="80" y="499" font-size="19" fill="#087B73" font-weight="600">Agreed spec + examples</text><path d="M1135 450 V487 H745 V615 H675" fill="none" stroke="#087B73" stroke-width="3" marker-end="url(#teal)" /><text x="837" y="479" font-size="19" fill="#087B73" font-weight="600">Permitted source references</text><rect x="60" y="544" width="610" height="200" rx="14" fill="#E7F5F0" /><text x="84" y="577" font-size="17" fill="#295FA7" font-weight="700">L4 · CONTEXT</text><text x="84" y="613" font-size="27" fill="#173047" font-weight="700">Assemble this task’s context</text><text x="84" y="650" font-size="22" fill="#536B7C" font-weight="400">Applicable rules + relevant code + acceptance cases</text><text x="84" y="681" font-size="22" fill="#536B7C" font-weight="400">Include source versions, access scope and gaps.</text><text x="84" y="712" font-size="22" fill="#536B7C" font-weight="400">Required missing inputs block affected work.</text><rect x="830" y="544" width="610" height="200" rx="14" fill="#EEF4FC" /><text x="854" y="577" font-size="17" fill="#295FA7" font-weight="700">L3 · EXECUTION</text><text x="854" y="613" font-size="27" fill="#173047" font-weight="700">Produce a reviewable candidate</text><text x="854" y="650" font-size="22" fill="#536B7C" font-weight="400">Proposed specification, design, code or review</text><text x="854" y="681" font-size="22" fill="#536B7C" font-weight="400">Scoped tools and an isolated working environment</text><text x="854" y="712" font-size="22" fill="#536B7C" font-weight="400">Links back to the spec and context used</text><path d="M675 668 H824" fill="none" stroke="#087B73" stroke-width="3" marker-end="url(#teal)" /><text x="684" y="648" font-size="16" fill="#087B73" font-weight="600">Task context</text><path d="M1135 748 V832" fill="none" stroke="#087B73" stroke-width="3" marker-end="url(#teal)" /><text x="1161" y="785" font-size="19" fill="#087B73" font-weight="600">Release candidate</text><rect x="830" y="838" width="610" height="220" rx="14" fill="#FCF3E2" /><text x="854" y="871" font-size="17" fill="#295FA7" font-weight="700">L2 · VERIFICATION + RELEASE DECISION</text><text x="854" y="907" font-size="27" fill="#173047" font-weight="700">Check behavior and release conditions</text><text x="854" y="944" font-size="22" fill="#536B7C" font-weight="400">Link required checks to the exact candidate.</text><text x="854" y="975" font-size="22" fill="#536B7C" font-weight="400">Domain-owned cases remain independent inputs.</text><text x="854" y="1006" font-size="22" fill="#536B7C" font-weight="400">Changed requirements return work for review.</text><rect x="60" y="838" width="610" height="220" rx="14" fill="#EEF4FC" /><text x="84" y="871" font-size="17" fill="#295FA7" font-weight="700">CONDITIONAL DELIVERY</text><text x="84" y="907" font-size="27" fill="#173047" font-weight="700">Deploy the authorized release bundle</text><text x="84" y="944" font-size="22" fill="#536B7C" font-weight="400">Bind build, configuration, rules and evidence.</text><text x="84" y="975" font-size="22" fill="#536B7C" font-weight="400">Deploy only after required checks and approval.</text><text x="84" y="1006" font-size="22" fill="#536B7C" font-weight="400">Capture receipt and observe business outcomes.</text><path d="M824 986 H675" fill="none" stroke="#087B73" stroke-width="3" marker-end="url(#teal)" /><text x="689" y="935" font-size="17" fill="#087B73" font-weight="600">Evidence +</text><text x="689" y="959" font-size="17" fill="#087B73" font-weight="600">authorization</text><path d="M590 246 V216 H1470 V915 H1445" fill="none" stroke="#98621B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#amber)" /><rect x="865" y="199" width="545" height="33" rx="14" fill="white" /><text x="881" y="222" font-size="19" fill="#98621B" font-weight="600">Domain-approved acceptance cases → checks</text><path d="M365 1062 V1110" fill="none" stroke="#295FA7" stroke-width="3" marker-end="url(#blue)" /><path d="M1135 1062 V1110" fill="none" stroke="#295FA7" stroke-width="3" marker-end="url(#blue)" /><rect x="60" y="1115" width="1380" height="136" rx="14" fill="#173047" /><text x="82" y="1151" font-size="19" fill="#BDD6E1" font-weight="700">L1 · RETAIN EVIDENCE; REVIEW WHAT FUTURE WORK CAN REUSE</text><text x="82" y="1187" font-size="23" fill="white" font-weight="600">Work item → spec → source/context revisions → candidate → checks → release decision</text><text x="82" y="1224" font-size="22" fill="white" font-weight="400">Outcomes + decision records → owner review → approved knowledge, specifications and checks</text><path d="M60 1203 H26 V341 H54" fill="none" stroke="#295FA7" stroke-width="3" marker-end="url(#blue)" /><text x="60" y="1291" font-size="21" fill="#536B7C" font-weight="400">Version and evaluate learning updates before reuse. Preserve owners, access rules and a rollback path.</text><path d="M60 1310 H1440" stroke="#D6E2EA" /><text x="60" y="1343" font-size="17" fill="#536B7C" font-weight="400">Proposed architecture · Arrows show exchanged artifacts and reviewed updates</text><text x="1230" y="1343" font-size="17" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text><path d="M1440 1203 H1486 V383 H1446" fill="none" stroke="#295FA7" stroke-width="3" marker-end="url(#blue)" /><text x="1478" y="1110" font-size="16" fill="#295FA7" transform="rotate(-90 1478 1110)">Reviewed knowledge updates</text><text x="1161" y="811" font-size="19" fill="#087B73" font-weight="600">+ run references</text></svg>