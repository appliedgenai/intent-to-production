<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1350" viewBox="0 0 1400 1350" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087B73"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#295FA7"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98621B"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#AC4836"/></marker></defs><rect x="1" y="1" width="1398" height="1348" fill="white" stroke="#D6E2EA" rx="18"/><text x="48" y="63" font-size="34" fill="#173047" font-weight="700">Six layers. One change the business can rely on.</text><text x="48" y="104" font-size="21" fill="#536B7C" font-weight="400">Buy or reuse broad capabilities. Own domain meaning, interfaces and the evidence connecting them.</text><rect x="48" y="141" width="1304" height="78" fill="#173047" stroke="none" rx="13"/><text x="72" y="177" font-size="17" fill="#BDD6E1" font-weight="700">ONB-017 · CATCH MISSING DOCUMENTS BEFORE SUBMISSION</text><text x="72" y="205" font-size="22" fill="white" font-weight="600">Preserve draft saving. Carry that decision from the work item to verified production behavior.</text><text x="67" y="257" font-size="16" fill="#536B7C" font-weight="700">RESPONSIBILITY</text><text x="353" y="257" font-size="16" fill="#295FA7" font-weight="700">BUY / REUSE</text><text x="720" y="257" font-size="16" fill="#087B73" font-weight="700">OWN / INTEGRATE</text><rect x="48" y="276" width="1109" height="129" fill="#EEF4FC" stroke="none" rx="13"/><text x="67" y="310" font-size="25" fill="#173047" font-weight="700">L6 · Intent</text><text x="67" y="345" font-size="19" fill="#536B7C" font-weight="400">Agree the change and</text><text x="67" y="372" font-size="19" fill="#536B7C" font-weight="400">what must survive</text><text x="353" y="314" font-size="20" fill="#295FA7" font-weight="400">Jira / Boards / Linear / Projects</text><text x="353" y="346" font-size="20" fill="#295FA7" font-weight="400">Kiro specs OR Spec Kit</text><text x="720" y="324" font-size="21" fill="#087B73" font-weight="400">Outcome + acceptance examples</text><text x="720" y="358" font-size="21" fill="#087B73" font-weight="400">CHG-42 → ONB-017 → SP-42</text><rect x="48" y="420" width="1109" height="129" fill="#E7F5F0" stroke="none" rx="13"/><text x="67" y="454" font-size="25" fill="#173047" font-weight="700">L5 · Knowledge</text><text x="67" y="489" font-size="19" fill="#536B7C" font-weight="400">Maintain sources and</text><text x="67" y="516" font-size="19" fill="#536B7C" font-weight="400">known relationships</text><text x="353" y="458" font-size="20" fill="#295FA7" font-weight="400">Git / docs + service catalog</text><text x="353" y="490" font-size="20" fill="#295FA7" font-weight="400">Search / pgvector</text><text x="353" y="522" font-size="20" fill="#295FA7" font-weight="400">Neo4j if queries justify it</text><text x="720" y="468" font-size="21" fill="#087B73" font-weight="400">Rules, consumers, owners, tests</text><text x="720" y="502" font-size="21" fill="#087B73" font-weight="400">POL-17@v4 + provenance / gaps</text><rect x="48" y="564" width="1109" height="129" fill="#EEF4FC" stroke="none" rx="13"/><text x="67" y="598" font-size="25" fill="#173047" font-weight="700">L4 · Context</text><text x="67" y="633" font-size="19" fill="#536B7C" font-weight="400">Select authorized evidence</text><text x="67" y="660" font-size="19" fill="#536B7C" font-weight="400">for this task</text><text x="353" y="602" font-size="20" fill="#295FA7" font-weight="400">Native code search</text><text x="353" y="634" font-size="20" fill="#295FA7" font-weight="400">LlamaIndex / GraphRAG</text><text x="353" y="666" font-size="20" fill="#295FA7" font-weight="400">Managed retrieval where useful</text><text x="720" y="612" font-size="21" fill="#087B73" font-weight="400">Selection + access + revisions</text><text x="720" y="646" font-size="21" fill="#087B73" font-weight="400">CTX-42 with omissions / expiry</text><rect x="48" y="708" width="1109" height="129" fill="#E7F5F0" stroke="none" rx="13"/><text x="67" y="742" font-size="25" fill="#173047" font-weight="700">L3 · Execution</text><text x="67" y="777" font-size="19" fill="#536B7C" font-weight="400">Produce a bounded change</text><text x="67" y="804" font-size="19" fill="#536B7C" font-weight="400">in an isolated environment</text><text x="353" y="746" font-size="20" fill="#295FA7" font-weight="400">Approved coding agent</text><text x="353" y="778" font-size="20" fill="#295FA7" font-weight="400">Runners + existing CI jobs</text><text x="353" y="810" font-size="20" fill="#295FA7" font-weight="400">Orchestration only if needed</text><text x="720" y="756" font-size="21" fill="#087B73" font-weight="400">Domain tools + scope + recovery</text><text x="720" y="790" font-size="21" fill="#087B73" font-weight="400">RUN-42 → candidate a71</text><rect x="48" y="852" width="1109" height="129" fill="#FCF3E2" stroke="none" rx="13"/><text x="67" y="886" font-size="25" fill="#173047" font-weight="700">L2 · Control</text><text x="67" y="921" font-size="19" fill="#536B7C" font-weight="400">Constrain and evaluate</text><text x="67" y="948" font-size="19" fill="#536B7C" font-weight="400">throughout the lifecycle</text><text x="353" y="890" font-size="20" fill="#295FA7" font-weight="400">CI / tests / security checks</text><text x="353" y="922" font-size="20" fill="#295FA7" font-weight="400">OPA / architecture checks</text><text x="353" y="954" font-size="20" fill="#295FA7" font-weight="400">Existing deployment controls</text><text x="720" y="900" font-size="21" fill="#087B73" font-weight="400">Preservation + consumer cases</text><text x="720" y="934" font-size="21" fill="#087B73" font-weight="400">EVAL-42 + release conditions</text><rect x="48" y="996" width="1109" height="129" fill="#E7F5F0" stroke="none" rx="13"/><text x="67" y="1030" font-size="21" fill="#173047" font-weight="700">L1 · Memory &amp; evidence</text><text x="67" y="1065" font-size="19" fill="#536B7C" font-weight="400">Record results and curate</text><text x="67" y="1092" font-size="19" fill="#536B7C" font-weight="400">what future work can reuse</text><text x="353" y="1034" font-size="20" fill="#295FA7" font-weight="400">Git / artifact stores</text><text x="353" y="1066" font-size="20" fill="#295FA7" font-weight="400">OpenTelemetry / Langfuse</text><text x="353" y="1098" font-size="20" fill="#295FA7" font-weight="400">Existing analytics</text><text x="720" y="1044" font-size="21" fill="#087B73" font-weight="400">Version links + retained results</text><text x="720" y="1078" font-size="21" fill="#087B73" font-weight="400">REL-42 + outcomes when known</text><rect x="1181" y="276" width="171" height="849" fill="#173047" stroke="none" rx="13"/><text x="1201" y="316" font-size="17" fill="#BDD6E1" font-weight="400">L2 CONTROLS</text><text x="1201" y="343" font-size="17" fill="#BDD6E1" font-weight="400">EVERY LAYER</text><text x="1201" y="428" font-size="19" fill="white" font-weight="400">Source access</text><text x="1201" y="493" font-size="19" fill="white" font-weight="400">Tool rights</text><text x="1201" y="558" font-size="19" fill="white" font-weight="400">Current policy</text><text x="1201" y="623" font-size="19" fill="white" font-weight="400">Required checks</text><text x="1201" y="688" font-size="19" fill="white" font-weight="400">Release gates</text><text x="1201" y="846" font-size="17" fill="#BDD6E1" font-weight="400">L1 EVIDENCE</text><text x="1201" y="873" font-size="17" fill="#BDD6E1" font-weight="400">LINKS THEM</text><text x="1201" y="932" font-size="19" fill="white" font-weight="400">Revisions</text><text x="1201" y="975" font-size="19" fill="white" font-weight="400">Decisions</text><text x="1201" y="1018" font-size="19" fill="white" font-weight="400">Outcomes</text><rect x="48" y="1160" width="1304" height="89" fill="#E7F5F0" stroke="none" rx="13"/><text x="72" y="1195" font-size="17" fill="#087B73" font-weight="700">SHARED SERVICES AND REVIEWED LEARNING</text><text x="72" y="1227" font-size="21" fill="#173047" font-weight="600">Identity · secrets · model access · isolation · cost attribution     |     Outcomes → reviewed sources / tests / skills</text><text x="48" y="1283" font-size="20" fill="#536B7C" font-weight="400">Logical responsibilities, not a sequence or six new services. Each product may cover several capabilities.</text><path d="M48 1298 H1352" stroke="#D6E2EA"/><text x="48" y="1327" font-size="16" fill="#536B7C" font-weight="400">Reference architecture · Synthetic ONB-017 · Tool options, not a tested integration</text><text x="1092" y="1327" font-size="16" fill="#536B7C" font-weight="400">Mohit Mittal · 2026</text></svg>