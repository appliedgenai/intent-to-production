<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1390" viewBox="0 0 1400 1390" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087C75"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245BA4"/></marker></defs><rect x="1" y="1" width="1398" height="1388" rx="18" fill="white" stroke="#D2DFE8"/><text x="48" y="63" font-size="37" fill="#142D41" font-weight="700">Six layers. One connected delivery system.</text><text x="48" y="103" font-size="21" fill="#50677A" font-weight="400">Preserve the relationships between intent, knowledge, context, execution and verified outcomes.</text><text x="98" y="155" font-size="16" fill="#50677A" font-weight="700">LOGICAL LAYERS / RESPONSIBILITIES</text><text x="606" y="155" font-size="16" fill="#245BA4" font-weight="700">CAPABILITIES TO BUY OR REUSE</text><text x="996" y="155" font-size="16" fill="#087C75" font-weight="700">INTERFACE / OWNED ASSET</text><rect x="98" y="174" width="1254" height="144" rx="12" fill="#EEF4FD" stroke="none"/><rect x="98" y="174" width="70" height="144" rx="12" fill="#142D41" stroke="none"/><text x="111" y="218" font-size="25" fill="white" font-weight="700">L6</text><text x="190" y="211" font-size="27" fill="#142D41" font-weight="700">Intent</text><text x="190" y="239" font-size="18" fill="#50677A" font-weight="400">Define what success means</text><text x="190" y="273" font-size="18" fill="#50677A" font-weight="400">Outcome · requirements · design</text><text x="190" y="300" font-size="18" fill="#50677A" font-weight="400">Acceptance examples · decisions</text><text x="606" y="223" font-size="19" fill="#245BA4" font-weight="600">Jira / Boards / Linear / Projects</text><text x="606" y="255" font-size="19" fill="#245BA4" font-weight="600">Kiro specs OR GitHub Spec Kit</text><rect x="978" y="194" width="352" height="104" rx="12" fill="white" stroke="none"/><text x="996" y="232" font-size="20" fill="#087C75" font-weight="600">Work ID + spec revision</text><text x="996" y="265" font-size="20" fill="#087C75" font-weight="600">Acceptance contract</text><path d="M1160 320 V330" fill="none" stroke="#245BA4" stroke-width="3"  marker-end="url(#blue)"/><rect x="98" y="332" width="1254" height="144" rx="12" fill="#E7F5F1" stroke="none"/><rect x="98" y="332" width="70" height="144" rx="12" fill="#142D41" stroke="none"/><text x="111" y="376" font-size="25" fill="white" font-weight="700">L5</text><text x="190" y="369" font-size="27" fill="#142D41" font-weight="700">Knowledge</text><text x="190" y="397" font-size="18" fill="#50677A" font-weight="400">Maintain what the firm knows</text><text x="190" y="431" font-size="18" fill="#50677A" font-weight="400">Sources · ownership · relationships</text><text x="190" y="458" font-size="18" fill="#50677A" font-weight="400">Provenance · permissions · freshness</text><text x="606" y="381" font-size="19" fill="#245BA4" font-weight="600">Git / docs · Backstage catalog</text><text x="606" y="413" font-size="19" fill="#245BA4" font-weight="600">OpenSearch / pgvector · Neo4j</text><rect x="978" y="352" width="352" height="104" rx="12" fill="white" stroke="none"/><text x="996" y="390" font-size="20" fill="#087C75" font-weight="600">Source register + ontology</text><text x="996" y="423" font-size="20" fill="#087C75" font-weight="600">Versioned relationship set</text><path d="M1160 478 V488" fill="none" stroke="#245BA4" stroke-width="3"  marker-end="url(#blue)"/><rect x="98" y="490" width="1254" height="144" rx="12" fill="#EEF4FD" stroke="none"/><rect x="98" y="490" width="70" height="144" rx="12" fill="#142D41" stroke="none"/><text x="111" y="534" font-size="25" fill="white" font-weight="700">L4</text><text x="190" y="527" font-size="27" fill="#142D41" font-weight="700">Context</text><text x="190" y="555" font-size="18" fill="#50677A" font-weight="400">Select what this task needs</text><text x="190" y="589" font-size="18" fill="#50677A" font-weight="400">Authorized retrieval · graph expansion</text><text x="190" y="616" font-size="18" fill="#50677A" font-weight="400">Ranking · budget · unresolved gaps</text><text x="606" y="539" font-size="19" fill="#245BA4" font-weight="600">Native search · LlamaIndex</text><text x="606" y="571" font-size="19" fill="#245BA4" font-weight="600">GraphRAG / managed retrieval</text><rect x="978" y="510" width="352" height="104" rx="12" fill="white" stroke="none"/><text x="996" y="548" font-size="20" fill="#087C75" font-weight="600">Task-scoped context pack</text><text x="996" y="581" font-size="20" fill="#087C75" font-weight="600">References + gap manifest</text><path d="M1160 636 V646" fill="none" stroke="#245BA4" stroke-width="3"  marker-end="url(#blue)"/><rect x="98" y="648" width="1254" height="144" rx="12" fill="#E7F5F1" stroke="none"/><rect x="98" y="648" width="70" height="144" rx="12" fill="#142D41" stroke="none"/><text x="111" y="692" font-size="25" fill="white" font-weight="700">L3</text><text x="190" y="685" font-size="27" fill="#142D41" font-weight="700">Execution</text><text x="190" y="713" font-size="18" fill="#50677A" font-weight="400">Perform bounded work</text><text x="190" y="747" font-size="18" fill="#50677A" font-weight="400">Plan · tools · isolated workspace</text><text x="190" y="774" font-size="18" fill="#50677A" font-weight="400">Checkpoints · budgets · escalation</text><text x="606" y="697" font-size="19" fill="#245BA4" font-weight="600">Kiro / approved coding agent</text><text x="606" y="729" font-size="19" fill="#245BA4" font-weight="600">Runners · optional orchestration</text><rect x="978" y="668" width="352" height="104" rx="12" fill="white" stroke="none"/><text x="996" y="706" font-size="20" fill="#087C75" font-weight="600">Proposed change + run ID</text><text x="996" y="739" font-size="20" fill="#087C75" font-weight="600">Tool / checkpoint receipts</text><path 