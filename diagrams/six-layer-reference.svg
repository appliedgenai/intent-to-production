 analysis</text><text x="606" y="1013" font-size="19" fill="#245BA4" font-weight="600">Git / artifact stores · telemetry</text><text x="606" y="1045" font-size="19" fill="#245BA4" font-weight="600">OpenTelemetry / Langfuse</text><rect x="978" y="984" width="352" height="104" rx="12" fill="white" stroke="none"/><text x="996" y="1022" font-size="20" fill="#087C75" font-weight="600">Linked release evidence</text><text x="996" y="1055" font-size="20" fill="#087C75" font-weight="600">Reviewed learning changes</text><path d="M96 1036 H59 V405 H94" fill="none" stroke="#087C75" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#teal)"/><text transform="translate(36 944) rotate(-90)" font-size="18" fill="#087C75" font-weight="600">Reviewed learning updates knowledge and tests</text><rect x="98" y="1145" width="1254" height="102" rx="12" fill="#142D41" stroke="none"/><text x="122" y="1177" font-size="16" fill="#ADCDD9" font-weight="700">SHARED SERVICES ACROSS ALL SIX LAYERS</text><text x="122" y="1210" font-size="22" fill="white" font-weight="600">Identity + secrets   •   Model access   •   Tool gateways   •   Isolation   •   Cost attribution</text><text x="98" y="1289" font-size="20" fill="#50677A" font-weight="400">Control applies throughout. Products can span layers. Arrows show linked artifacts, not a waterfall.</text><path d="M48 1334 H1352" stroke="#D2DFE8"/><text x="48" y="1364" font-size="17" fill="#50677A" font-weight="400">Reference architecture · Tool options, not a pre-integrated product stack</text><text x="1058" y="1364" font-size="17" fill="#50677A" font-weight="400">Mohit Mittal · Sep 2026</text></svg>