<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087C75"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245BA4"/></marker></defs><rect x="1" y="1" width="1398" height="1108" rx="18" fill="white" stroke="#D2DFE8"/><text x="48" y="63" font-size="37" fill="#142D41" font-weight="700">Jira owns the commitment. The spec owns the behavior.</text><text x="48" y="103" font-size="21" fill="#50677A" font-weight="400">Connect authoritative records with stable identifiers and verified workflow events.</text><rect x="48" y="157" width="380" height="220" rx="12" fill="#EEF4FD" stroke="none"/><text x="72" y="191" font-size="15" fill="#50677A" font-weight="700">TEAM WORK RECORD</text><text x="72" y="230" font-size="27" fill="#142D41" font-weight="700">Jira / Boards / Projects</text><text x="72" y="269" font-size="21" fill="#50677A" font-weight="400">Priority · owner · dependency</text><text x="72" y="300" font-size="21" fill="#50677A" font-weight="400">Agreed scope + spec link</text><text x="72" y="331" font-size="21" fill="#50677A" font-weight="400">Delivery status</text><rect x="510" y="157" width="395" height="220" rx="12" fill="#E7F5F1" stroke="none"/><text x="534" y="191" font-size="15" fill="#50677A" font-weight="700">VERSIONED FEATURE RECORD</text><text x="534" y="230" font-size="27" fill="#142D41" font-weight="700">Kiro specs OR Spec Kit</text><text x="534" y="269" font-size="21" fill="#50677A" font-weight="400">Requirements → design → tasks</text><text x="534" y="300" font-size="21" fill="#50677A" font-weight="400">Acceptance examples + decisions</text><text x="534" y="331" font-size="21" fill="#50677A" font-weight="400">Git history + spec revision</text><rect x="987" y="157" width="365" height="220" rx="12" fill="#EEF4FD" stroke="none"/><text x="1011" y="191" font-size="15" fill="#50677A" font-weight="700">TRANSIENT EXECUTION STATE</text><text x="1011" y="230" font-size="27" fill="#142D41" font-weight="700">Agent task / run</text><text x="1011" y="269" font-size="21" fill="#50677A" font-weight="400">Plan · attempts · checkpoints</text><text x="1011" y="300" font-size="21" fill="#50677A" font-weight="400">Context + bounded tool access</text><text x="1011" y="331" font-size="21" fill="#50677A" font-weight="400">Questions and escalation</text><path d="M430 262 H506" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="442" y="239" font-size="15" fill="#087C75" font-weight="600">Work ID</text><path d="M907 262 H983" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="917" y="239" font-size="15" fill="#087C75" font-weight="600">Spec rev</text><path d="M1170 379 V493" fill="none" stroke="#245BA4" stroke-width="3"  marker-end="url(#blue)"/><text x="1190" y="427" font-size="17" fill="#245BA4" font-weight="400">Run ID</text><text x="1190" y="452" font-size="17" fill="#245BA4" font-weight="400">+ refs</text><rect x="987" y="497" width="365" height="224" rx="12" fill="#EEF4FD" stroke="none"/><text x="1011" y="531" font-size="15" fill="#50677A" font-weight="700">ENGINEERING ARTIFACT</text><text x="1011" y="570" font-size="27" fill="#142D41" font-weight="700">Proposed pull request</text><text x="1011" y="609" font-size="21" fill="#50677A" font-weight="400">Work + spec + run references</text><text x="1011" y="640" font-size="21" fill="#50677A" font-weight="400">Small diff + review context</text><text x="1011" y="671" font-size="21" fill="#50677A" font-weight="400">No automatic release claim</text><rect x="510" y="497" width="395" height="224" rx="12" fill="#FCF4E4" stroke="none"/><text x="534" y="531" font-size="15" fill="#50677A" font-weight="700">VERIFICATION RECORD</text><text x="534" y="570" font-size="27" fill="#142D41" font-weight="700">CI + evaluations + review</text><text x="534" y="609" font-size="21" fill="#50677A" font-weight="400">Behavior · contracts · architecture</text><text x="534" y="640" font-size="21" fill="#50677A" font-weight="400">Security + applicable model checks</text><text x="534" y="671" font-size="21" fill="#50677A" font-weight="400">Results bound to exact revisions</text><rect x="48" y="497" width="380" height="224" rx="12" fill="#F3EFFA" stroke="none"/><text x="72" y="531" font-size="15" fill="#50677A" font-weight="700">OPERATIONAL RECORD</text><text x="72" y="570" font-size="27" fill="#142D41" font-weight="700">Release + observed result</text><text x="72" y="609" font-size="21" fill="#50677A" font-weight="400">Artifact + deployment identity</text><text x="72" y="640" font-size="21" fill="#50677A" font-weight="400">Verification / rollback evidence</text><text x="72" y="671" font-size="21" fill="#50677A" font-weight="400">Service owner + outcome signal</text><path d="M985 606 H909" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="919" y="580" font-size="16" fill="#087C75" font-weight="600">Diff</text><path d="M508 606 H432" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="443" y="580" font-size="16" fill="#087C75" font-weight="600">Gate</text><path d="M235 495 V381" fill="none" stroke="#245BA4" stroke-width="3"  marker-end="url(#blue)"/><text x="254" y="426" font-size="18" fill="#245BA4" font-weight="600">Controlled status update</text><text x="254" y="452" font-size="18" fill="#245BA4" font-weight="600">from verified events</text><rect x="48" y="772" width="1304" height="116" rx="12" fill="#142D41" stroke="none"/><text x="72" y="808" font-size="16" fill="#ADCDD9" font-weight="700">ENTERPRISE INTEGRATION CONTRACT</text><text x="72" y="845" font-size="23" fill="white" font-weight="600">work_item_id → spec_revision → run_id → PR / commit → evaluation → release_id</text><text x="48" y="936" font-size="21" fill="#50677A" font-weight="400">Resolve conflicts explicitly: changed scope returns to the spec owner; failed checks return to engineering.</text><text x="48" y="975" font-size="20" fill="#50677A" font-weight="400">Do not mirror every agent thought into Jira. This adapter is proposed—not a claim of native Jira–Kiro sync.</text><path d="M48 1054 H1352" stroke="#D2DFE8"/><text x="48" y="1084" font-size="17" fill="#50677A" font-weight="400">Reference architecture · Tool options, not a pre-integrated product stack</text><text x="1058" y="1084" font-size="17" fill="#50677A" font-weight="400">Mohit Mittal · Sep 2026</text></svg>