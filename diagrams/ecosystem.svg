<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087C73"/></marker></defs><rect x="1" y="1" width="1198" height="1198" fill="white" stroke="#DCE5EC" rx="18"/><text x="48" y="62" font-size="33" fill="#162A3A" font-weight="700">Six layers. Concrete outputs. Explicit ownership.</text><text x="48" y="101" font-size="19" fill="#566B7B" font-weight="400">Buy broad capabilities; retain the domain decisions and the evidence that connects them.</text><text x="48" y="157" font-size="14" fill="#566B7B" font-weight="700">RESPONSIBILITY</text><text x="252" y="157" font-size="14" fill="#29599C" font-weight="700">BUY / REUSE</text><text x="543" y="157" font-size="14" fill="#087C73" font-weight="700">OWN / INTEGRATE / BUILD</text><text x="925" y="157" font-size="14" fill="#566B7B" font-weight="700">OUTPUT</text><rect x="48" y="180" width="1104" height="119" fill="#F9FBFD" stroke="none" rx="12"/><text x="66" y="219" font-size="23" fill="#162A3A" font-weight="700">L6</text><text x="66" y="258" font-size="23" fill="#162A3A" font-weight="600">Intent</text><text x="252" y="223" font-size="17" fill="#566B7B" font-weight="400">Planning and spec tooling</text><text x="252" y="253" font-size="17" fill="#566B7B" font-weight="400">Existing backlog + Git</text><rect x="526" y="188" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="215" font-size="16" fill="white" font-weight="400">Draft versus submission semantics</text><text x="543" y="244" font-size="16" fill="white" font-weight="400">Acceptance examples and risk</text><text x="543" y="273" font-size="16" fill="white" font-weight="400">Decision rights and open questions</text><text x="925" y="223" font-size="17" fill="#566B7B" font-weight="400">Intent revision</text><text x="925" y="253" font-size="17" fill="#566B7B" font-weight="400">Domain examples</text><rect x="48" y="313" width="1104" height="119" fill="#F3F6F9" stroke="none" rx="12"/><text x="66" y="352" font-size="23" fill="#162A3A" font-weight="700">L5</text><text x="66" y="391" font-size="23" fill="#162A3A" font-weight="600">Knowledge</text><text x="252" y="356" font-size="17" fill="#566B7B" font-weight="400">Source stores and catalog</text><text x="252" y="386" font-size="17" fill="#566B7B" font-weight="400">Code search / navigation</text><rect x="526" y="321" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="348" font-size="16" fill="white" font-weight="400">Rule authority and source precedence</text><text x="543" y="377" font-size="16" fill="white" font-weight="400">Service and consumer ownership</text><text x="543" y="406" font-size="16" fill="white" font-weight="400">Revision and access mappings</text><text x="925" y="356" font-size="17" fill="#566B7B" font-weight="400">Source register</text><text x="925" y="386" font-size="17" fill="#566B7B" font-weight="400">Consumer map</text><rect x="48" y="446" width="1104" height="119" fill="#F9FBFD" stroke="none" rx="12"/><text x="66" y="485" font-size="23" fill="#162A3A" font-weight="700">L4</text><text x="66" y="524" font-size="23" fill="#162A3A" font-weight="600">Context</text><text x="252" y="489" font-size="17" fill="#566B7B" font-weight="400">Retrieval and connectors</text><text x="252" y="519" font-size="17" fill="#566B7B" font-weight="400">Parsing / indexing</text><rect x="526" y="454" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="481" font-size="16" fill="white" font-weight="400">Task-scoped evidence assembly</text><text x="543" y="510" font-size="16" fill="white" font-weight="400">Permissions and known gaps</text><text x="543" y="539" font-size="16" fill="white" font-weight="400">References to source revisions</text><text x="925" y="489" font-size="17" fill="#566B7B" font-weight="400">Context manifest</text><text x="925" y="519" font-size="17" fill="#566B7B" font-weight="400">Gap register</text><rect x="48" y="579" width="1104" height="119" fill="#F3F6F9" stroke="none" rx="12"/><text x="66" y="618" font-size="23" fill="#162A3A" font-weight="700">L3</text><text x="66" y="657" font-size="23" fill="#162A3A" font-weight="600">Execution</text><text x="252" y="622" font-size="17" fill="#566B7B" font-weight="400">Coding agent + runners</text><text x="252" y="652" font-size="17" fill="#566B7B" font-weight="400">Model and tool access</text><rect x="526" y="587" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="614" font-size="16" fill="white" font-weight="400">Task boundaries and adapters</text><text x="543" y="643" font-size="16" fill="white" font-weight="400">Isolated environment policy</text><text x="543" y="672" font-size="16" fill="white" font-weight="400">Small changes and escalation</text><text x="925" y="622" font-size="17" fill="#566B7B" font-weight="400">Proposed diff</text><text x="925" y="652" font-size="17" fill="#566B7B" font-weight="400">Task receipts</text><rect x="48" y="712" width="1104" height="119" fill="#F9FBFD" stroke="none" rx="12"/><text x="66" y="751" font-size="23" fill="#162A3A" font-weight="700">L2</text><text x="66" y="790" font-size="23" fill="#162A3A" font-weight="600">Control</text><text x="252" y="755" font-size="17" fill="#566B7B" font-weight="400">CI and security checks</text><text x="252" y="785" font-size="17" fill="#566B7B" font-weight="400">Evaluation / deployment</text><rect x="526" y="720" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="747" font-size="16" fill="white" font-weight="400">Preservation and acceptance cases</text><text x="543" y="776" font-size="16" fill="white" font-weight="400">Compatibility and release criteria</text><text x="543" y="805" font-size="16" fill="white" font-weight="400">Evidence invalidation on change</text><text x="925" y="755" font-size="17" fill="#566B7B" font-weight="400">Test-set revision</text><text x="925" y="785" font-size="17" fill="#566B7B" font-weight="400">Release decision</text><rect x="48" y="845" width="1104" height="119" fill="#F3F6F9" stroke="none" rx="12"/><text x="66" y="884" font-size="23" fill="#162A3A" font-weight="700">L1</text><text x="66" y="923" font-size="23" fill="#162A3A" font-weight="600">Evidence</text><text x="252" y="888" font-size="17" fill="#566B7B" font-weight="400">Git and artifact stores</text><text x="252" y="918" font-size="17" fill="#566B7B" font-weight="400">Telemetry / analytics</text><rect x="526" y="853" width="372" height="103" fill="#162A3A" stroke="none" rx="12"/><text x="543" y="880" font-size="16" fill="white" font-weight="400">Intent-to-release relationships</text><text x="543" y="909" font-size="16" fill="white" font-weight="400">Business outcome correlation</text><text x="543" y="938" font-size="16" fill="white" font-weight="400">Curated incident-to-case feedback</text><text x="925" y="888" font-size="17" fill="#566B7B" font-weight="400">Release dossier</text><text x="925" y="918" font-size="17" fill="#566B7B" font-weight="400">Outcome cohort</text><rect x="48" y="1001" width="1104" height="92" fill="#E6F4F0" stroke="none" rx="12"/><text x="70" y="1031" font-size="14" fill="#087C73" font-weight="700">SHARED PLATFORM SERVICES</text><text x="70" y="1063" font-size="19" fill="#162A3A" font-weight="600">Identity / secrets  •  Model access  •  Tool permissions  •  Isolation  •  Evaluation / telemetry</text><text x="48" y="1120" font-size="18" fill="#566B7B" font-weight="400">Begin with repository artifacts and existing tools; create services for demonstrated recurring gaps.</text><line x1="48" y1="1150" x2="1152" y2="1150" stroke="#DCE5EC" stroke-width="2"/><text x="48" y="1179" font-size="15" fill="#566B7B" font-weight="400">Worked design • Illustrative, not an employer incident</text><text x="865" y="1179" font-size="15" fill="#566B7B" font-weight="400">Mohit Mittal · September 2026</text></svg>