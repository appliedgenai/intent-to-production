<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087C75"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245BA4"/></marker></defs><rect x="1" y="1" width="1398" height="1258" rx="18" fill="white" stroke="#D2DFE8"/><text x="48" y="63" font-size="37" fill="#142D41" font-weight="700">Knowledge persists. Context is assembled for a task.</text><text x="48" y="103" font-size="21" fill="#50677A" font-weight="400">Graph relationships and search results become useful only with provenance, access control and selection.</text><rect x="48" y="148" width="425" height="797" rx="12" fill="#E7F5F1" stroke="none"/><text x="72" y="187" font-size="18" fill="#087C75" font-weight="700">L5 · DURABLE KNOWLEDGE</text><text x="72" y="226" font-size="27" fill="#142D41" font-weight="700">Sources retain authority</text><text x="72" y="269" font-size="21" fill="#50677A" font-weight="400">Git · ADRs · API contracts</text><text x="72" y="301" font-size="21" fill="#50677A" font-weight="400">Policies · incidents · runbooks</text><text x="72" y="333" font-size="21" fill="#50677A" font-weight="400">Service catalog + owners</text><rect x="72" y="375" width="377" height="143" rx="12" fill="white" stroke="none"/><text x="94" y="411" font-size="24" fill="#142D41" font-weight="700">Search / index</text><text x="94" y="448" font-size="20" fill="#50677A" font-weight="400">Exact IDs + text + vectors</text><text x="94" y="479" font-size="20" fill="#50677A" font-weight="400">OpenSearch / pgvector</text><rect x="72" y="539" width="377" height="324" rx="12" fill="white" stroke="none"/><text x="94" y="578" font-size="24" fill="#142D41" font-weight="700">Relationship graph</text><text x="94" y="610" font-size="19" fill="#50677A" font-weight="400">Neo4j / catalog relationships</text><rect x="96" y="641" width="144" height="42" rx="12" fill="#EEF4FD" stroke="none"/><text x="115" y="669" font-size="19" fill="#245BA4" font-weight="600">Policy</text><rect x="294" y="641" width="132" height="42" rx="12" fill="#EEF4FD" stroke="none"/><text x="306" y="669" font-size="19" fill="#245BA4" font-weight="600">Capability</text><path d="M242 662 H291" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="244" y="648" font-size="12" fill="#087C75" font-weight="400">rules</text><path d="M360 685 V719" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="294" y="724" width="132" height="42" rx="12" fill="#EEF4FD" stroke="none"/><text x="322" y="752" font-size="19" fill="#245BA4" font-weight="600">Service</text><rect x="96" y="724" width="144" height="42" rx="12" fill="#EEF4FD" stroke="none"/><text x="120" y="752" font-size="19" fill="#245BA4" font-weight="600">Team</text><path d="M242 745 H291" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="246" y="733" font-size="12" fill="#087C75" font-weight="400">owns</text><text x="94" y="805" font-size="18" fill="#50677A" font-weight="400">Service → API · Spec → Service</text><text x="94" y="832" font-size="18" fill="#50677A" font-weight="400">Test → Requirement</text><text x="72" y="907" font-size="18" fill="#087C75" font-weight="600">Every edge: source, version, status</text><rect x="535" y="148" width="386" height="797" rx="12" fill="#EEF4FD" stroke="none"/><text x="559" y="187" font-size="18" fill="#245BA4" font-weight="700">L4 · CONTEXT ASSEMBLY</text><text x="559" y="226" font-size="25" fill="#142D41" font-weight="700">Task + identity + intent</text><rect x="559" y="268" width="338" height="119" rx="12" fill="white" stroke="none"/><rect x="575" y="286" width="38" height="38" rx="12" fill="#142D41" stroke="none"/><text x="587" y="312" font-size="20" fill="white" font-weight="700">1</text><text x="626" y="312" font-size="24" fill="#142D41" font-weight="700">Authorize</text><text x="575" y="354" font-size="17" fill="#50677A" font-weight="400">Filter sources and graph edges</text><path d="M728 389 V409" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="559" y="413" width="338" height="119" rx="12" fill="white" stroke="none"/><rect x="575" y="431" width="38" height="38" rx="12" fill="#142D41" stroke="none"/><text x="587" y="457" font-size="20" fill="white" font-weight="700">2</text><text x="626" y="457" font-size="24" fill="#142D41" font-weight="700">Retrieve + expand</text><text x="575" y="499" font-size="17" fill="#50677A" font-weight="400">IDs / search + bounded traversal</text><path d="M728 534 V554" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="559" y="558" width="338" height="119" rx="12" fill="white" stroke="none"/><rect x="575" y="576" width="38" height="38" rx="12" fill="#142D41" stroke="none"/><text x="587" y="602" font-size="20" fill="white" font-weight="700">3</text><text x="626" y="602" font-size="24" fill="#142D41" font-weight="700">Rank + budget</text><text x="575" y="644" font-size="17" fill="#50677A" font-weight="400">Prefer authority and task relevance</text><path d="M728 679 V699" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="559" y="703" width="338" height="119" rx="12" fill="white" stroke="none"/><rect x="575" y="721" width="38" height="38" rx="12" fill="#142D41" stroke="none"/><text x="587" y="747" font-size="20" fill="white" font-weight="700">4</text><text x="626" y="747" font-size="24" fill="#142D41" font-weight="700">Check + manifest</text><text x="575" y="789" font-size="17" fill="#50677A" font-weight="400">Freshness, conflicts and known gaps</text><text x="559" y="894" font-size="17" fill="#245BA4" font-weight="400">Native tools / LlamaIndex / GraphRAG</text><text x="559" y="920" font-size="17" fill="#245BA4" font-weight="400">Managed retrieval where suitable</text><path d="M475 446 H531" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><path d="M475 730 H512 V471 H531" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="983" y="148" width="369" height="797" rx="12" fill="#FCF4E4" stroke="none"/><text x="1007" y="187" font-size="18" fill="#956016" font-weight="700">TASK CONTEXT PACK</text><text x="1007" y="226" font-size="24" fill="#142D41" font-weight="700">Bounded, inspectable input</text><text x="1007" y="280" font-size="20" fill="#50677A" font-weight="400">Intent + acceptance examples</text><text x="1007" y="323" font-size="20" fill="#50677A" font-weight="400">Selected code / API contracts</text><text x="1007" y="366" font-size="20" fill="#50677A" font-weight="400">Applicable rules and ADRs</text><text x="1007" y="409" font-size="20" fill="#50677A" font-weight="400">Source IDs + revisions</text><text x="1007" y="452" font-size="20" fill="#50677A" font-weight="400">Unresolved conflicts / gaps</text><text x="1007" y="495" font-size="20" fill="#50677A" font-weight="400">Omissions + expiry conditions</text><path d="M899 762 H950 V543 H979" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><text x="946" y="815" font-size="15" fill="#245BA4" font-weight="600">Checked</text><text x="946" y="837" font-size="15" fill="#245BA4" font-weight="600">pack</text><path d="M1165 544 V591" fill="none" stroke="#087C75" stroke-width="3"  marker-end="url(#teal)"/><rect x="1007" y="608" width="321" height="188" rx="12" fill="white" stroke="none"/><text x="1030" y="649" font-size="26" fill="#142D41" font-weight="700">Agent / engineer</text><text x="1030" y="691" font-size="20" fill="#50677A" font-weight="400">Can investigate or escalate</text><text x="1030" y="723" font-size="20" fill="#50677A" font-weight="400">Permissions enforced</text><text x="1030" y="755" font-size="20" fill="#50677A" font-weight="400">outside these instructions</text><text x="1007" y="862" font-size="19" fill="#956016" font-weight="400">Cache scope includes identity,</text><text x="1007" y="891" font-size="19" fill="#956016" font-weight="400">tenant and source revisions.</text><rect x="48" y="982" width="1304" height="144" rx="12" fill="#142D41" stroke="none"/><text x="72" y="1018" font-size="17" fill="#ADCDD9" font-weight="700">L1 → L5 · CONTROLLED LEARNING</text><text x="72" y="1060" font-size="23" fill="white" font-weight="600">Observed result → investigate → review / redact → update source, skill or test → evaluate</text><text x="72" y="1098" font-size="20" fill="#ADCDD9" font-weight="400">Raw traces do not become authoritative knowledge by being indexed.</text><text x="48" y="1170" font-size="21" fill="#50677A" font-weight="400">Start with a bounded domain. Add graph infrastructure only when useful relationship queries justify it.</text><path d="M48 1204 H1352" stroke="#D2DFE8"/><text x="48" y="1234" font-size="17" fill="#50677A" font-weight="400">Reference architecture · Tool options, not a pre-integrated product stack</text><text x="1058" y="1234" font-size="17" fill="#50677A" font-weight="400">Mohit Mittal · Sep 2026</text></svg>