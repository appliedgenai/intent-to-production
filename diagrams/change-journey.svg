<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087C73"/></marker></defs><rect x="1" y="1" width="1198" height="998" fill="white" stroke="#DCE5EC" rx="18"/><text x="48" y="62" font-size="33" fill="#162A3A" font-weight="700">The feature looked right. The contract was wrong.</text><text x="48" y="101" font-size="19" fill="#566B7B" font-weight="400">One onboarding change shows where an intent-driven lifecycle creates value.</text><rect x="48" y="130" width="1104" height="72" fill="#162A3A" stroke="none" rx="12"/><text x="72" y="159" font-size="14" fill="#AFC8D8" font-weight="700">BUSINESS REQUEST</text><text x="72" y="186" font-size="23" fill="white" font-weight="600">“Catch missing documents before the advisor submits an application.”</text><rect x="48" y="235" width="530" height="410" fill="#FCF0ED" stroke="none" rx="12"/><rect x="622" y="235" width="530" height="410" fill="#E6F4F0" stroke="none" rx="12"/><text x="70" y="271" font-size="16" fill="#AD493E" font-weight="700">THE PLAUSIBLE SHORTCUT</text><text x="644" y="271" font-size="16" fill="#087C73" font-weight="700">THE DECISION THAT CHANGES THE DESIGN</text><text x="70" y="317" font-size="22" fill="#162A3A" font-weight="600">Add required-document validation</text><text x="70" y="347" font-size="22" fill="#162A3A" font-weight="600">to the shared save / submit helper.</text><text x="70" y="393" font-size="20" fill="#566B7B" font-weight="400">Generate tests with complete applications.</text><text x="70" y="424" font-size="20" fill="#566B7B" font-weight="400">Every test passes.</text><rect x="70" y="487" width="486" height="127" fill="white" stroke="#AD493E" rx="12"/><text x="88" y="519" font-size="14" fill="#AD493E" font-weight="700">MISSED BEHAVIOR</text><text x="88" y="553" font-size="20" fill="#162A3A" font-weight="400">An incomplete draft can no longer save.</text><text x="88" y="583" font-size="20" fill="#162A3A" font-weight="400">The advisor loses a supported workflow.</text><text x="644" y="317" font-size="21" fill="#162A3A" font-weight="600">Preserve: incomplete drafts can save.</text><text x="644" y="348" font-size="21" fill="#162A3A" font-weight="600">Change: submission checks completeness.</text><text x="644" y="393" font-size="19" fill="#566B7B" font-weight="400">Operations supplies the incomplete case.</text><text x="644" y="424" font-size="19" fill="#566B7B" font-weight="400">Engineering checks the shared code path.</text><rect x="644" y="487" width="486" height="127" fill="white" stroke="#087C73" rx="12"/><text x="662" y="519" font-size="14" fill="#087C73" font-weight="700">INDEPENDENT CHECK</text><text x="662" y="553" font-size="20" fill="#162A3A" font-weight="400">Save incomplete draft → succeeds</text><text x="662" y="583" font-size="20" fill="#162A3A" font-weight="400">Submit missing document → specific block</text><path d="M 600 649 L 600 683" fill="none" stroke="#087C73" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="695" width="1104" height="153" fill="#EFF4FB" stroke="none" rx="12"/><text x="70" y="730" font-size="15" fill="#29599C" font-weight="700">THE DELIVERY SYSTEM THAT MAKES THIS REPEATABLE</text><text x="70" y="772" font-size="24" fill="#162A3A" font-weight="700">Intent</text><text x="70" y="808" font-size="17" fill="#566B7B" font-weight="400">Examples + decisions</text><path d="M 292 767 L 321 767" fill="none" stroke="#087C73" stroke-width="3" marker-end="url(#arrow)"/><text x="343" y="772" font-size="24" fill="#162A3A" font-weight="700">Context</text><text x="343" y="808" font-size="17" fill="#566B7B" font-weight="400">Sources + known gaps</text><path d="M 565 767 L 594 767" fill="none" stroke="#087C73" stroke-width="3" marker-end="url(#arrow)"/><text x="616" y="772" font-size="24" fill="#162A3A" font-weight="700">Change</text><text x="616" y="808" font-size="17" fill="#566B7B" font-weight="400">Small reviewed diff</text><path d="M 838 767 L 867 767" fill="none" stroke="#087C73" stroke-width="3" marker-end="url(#arrow)"/><text x="889" y="772" font-size="24" fill="#162A3A" font-weight="700">Evidence</text><text x="889" y="808" font-size="17" fill="#566B7B" font-weight="400">Cases + release link</text><text x="48" y="901" font-size="23" fill="#162A3A" font-weight="600">The agent can write both the code and its tests from the same wrong assumption.</text><line x1="48" y1="945" x2="1152" y2="945" stroke="#DCE5EC" stroke-width="2"/><text x="48" y="974" font-size="15" fill="#566B7B" font-weight="400">Worked design • Illustrative, not an employer incident</text><text x="865" y="974" font-size="15" fill="#566B7B" font-weight="400">Mohit Mittal · September 2026</text></svg>